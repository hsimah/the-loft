name: Validate
on: push

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create placeholder .env files
        run: |
          for f in $(find . -name '.env.example'); do
            cp "$f" "${f%.example}"
          done

      - name: Create shared Docker networks
        run: docker network create loft-proxy

      - name: Validate base docker-compose files
        run: |
          for f in $(find services/ -name 'docker-compose.yml'); do
            echo "Validating $f..."
            docker compose -f "$f" config --quiet
          done

      - name: Validate howlr compose profiles
        run: |
          for profile in server client; do
            echo "Validating services/howlr/docker-compose.yml (profile: ${profile})..."
            COMPOSE_PROFILES="${profile}" docker compose -f services/howlr/docker-compose.yml config --quiet
          done

      - name: Validate sputnik compose profiles
        run: |
          for profile in engine chat agent engine,chat,agent; do
            echo "Validating services/sputnik/docker-compose.yml (profile: ${profile})..."
            COMPOSE_PROFILES="${profile}" docker compose -f services/sputnik/docker-compose.yml config --quiet
          done

      - name: Validate houstn compose profiles
        run: |
          for profile in hub metrics hub,metrics; do
            COMPOSE_PROFILES="${profile}" docker compose -f services/houstn/docker-compose.yml config --quiet
          done

      - name: Validate unprivileged application server configurations
        run: |
          docker run --rm --network none --read-only --user 1003:1003 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:uid=1003,gid=1003,mode=1770 \
            -v "$PWD/services/pawst/nginx-unprivileged.conf:/etc/nginx/nginx.conf:ro" \
            --entrypoint nginx nginx:1.30.4-alpine -t
          for host in fjord viking; do
            docker run --rm --network none --read-only --user 1003:1003 \
              --cap-drop ALL --cap-add NET_BIND_SERVICE --security-opt no-new-privileges \
              --tmpfs /tmp:uid=1003,gid=1003,mode=1770 \
              -e XDG_DATA_HOME=/tmp/data -e XDG_CONFIG_HOME=/tmp/config \
              -v "$PWD/hosts/$host/overrides/mushr/Caddyfile:/etc/caddy/Caddyfile:ro" \
              caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
          done

      - name: Validate Viking public tunnel profile
        run: |
          docker compose -f services/mushr/docker-compose.yml \
            -f hosts/viking/overrides/mushr/docker-compose.override.yml \
            --profile public config --quiet

      - name: Validate compose with overrides
        run: |
          for host_dir in hosts/*/; do
            host=$(basename "$host_dir")
            if [[ ! -d "${host_dir}overrides" ]]; then
              continue
            fi
            for override_dir in "${host_dir}overrides"/*/; do
              service=$(basename "$override_dir")
              base="services/${service}/docker-compose.yml"
              override="${override_dir}docker-compose.override.yml"
              if [[ -f "$base" && -f "$override" ]]; then
                echo "Validating ${base} + ${override} (host: ${host})..."
                docker compose -f "$base" -f "$override" config --quiet
              fi
            done
          done

  validate-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check shell scripts
        run: |
          for f in setup.sh loft-ctl bashrc.d control-plane/*.sh control-plane/hooks/* services/*/*.sh services/*/*/*.sh hosts/*/bootstrap; do
            [ -e "$f" ] || continue
            echo "Checking $f..."
            bash -n "$f"
          done

      - name: Install release-test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq rsync util-linux nftables
          docker compose version

      - name: Validate Viking firewall in an isolated network namespace
        run: |
          sudo install -d -m 0755 /etc/loft
          sudo install -m 0644 hosts/viking/hardening/firewall*.nft /etc/loft/
          sudo unshare --net nft --check --file /etc/loft/firewall.nft
          systemd-analyze verify hosts/viking/hardening/loft-firewall.service

      - name: Health, deployment and platform regression tests and documentation links
        run: |
          python3 -m unittest discover -s tests -v
          python3 control-plane/check-docs.py

      - name: Validate JSON and Python syntax
        run: |
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path
          for path in [Path('daemon.json'), *Path('services').rglob('*.json'), *Path('hosts').rglob('*.json')]:
              json.loads(path.read_text())
          for directory in ('control-plane', 'tests'):
              for path in Path(directory).glob('*.py'):
                  ast.parse(path.read_text(), filename=str(path))
          PY

      - name: Syntax-check host.conf files
        run: |
          for f in hosts/*/host.conf; do
            echo "Checking $f..."
            bash -n "$f"
          done
