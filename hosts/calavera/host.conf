# hosts/calavera/host.conf

# ── Identity ───────────────────────────────────────────────────────
HOST_NAME="calavera"

# ── Services ───────────────────────────────────────────────────────
SERVICES=(howlr snoot houstn)

# ── Storage mount (leave empty for no mount) ───────────────────────
STORAGE_DEVICE=""
STORAGE_MOUNT=""
STORAGE_FS=""

# ── Directories (755 config dirs, 775 media dirs) ──────────────────
CONFIG_DIRS=()
MEDIA_DIRS=()

# ── User config ────────────────────────────────────────────────────
LITTLEDOG_EXTRA_GROUPS="audio"

# ── SSH ────────────────────────────────────────────────────────────
SSH_DISABLE_PASSWORD="true"

# ── WiFi watchdog ──────────────────────────────────────────────────
# USB Marvell adapter (mwifiex). Its firmware can crash with the interface
# still present; only a module reload recovers it, so the watchdog reloads
# the driver whenever IPv4 is lost. The module must be named explicitly:
# sysfs discovery resolves to usbcore for this adapter.
WIFI_IFACE="wlx501ac51167c0"
WIFI_DHCP_UNIT="NetworkManager"
WIFI_WATCHDOG_MINUTES="2"
WIFI_FW_RECOVERY="true"
WIFI_FW_MODULE="mwifiex_usb"

# ── i3 desktop ─────────────────────────────────────────────────────
# Autologs rodnik into i3 running firefox --kiosk on the Music Assistant
# now-playing view. I3_DPI 125 ≈ 130% scale.
I3_ENABLED="true"
I3_DASHBOARD_URL="https://howlr.loft.hsimah.com/#/home?player=calavera&showFullscreenPlayer=true"
I3_DPI="125"
# Snapcast stream ids (without the "Music Assistant - " prefix) that wake the
# screen (read from Snapweb Stream.OnProperties events):
#   syncgroupbkmvcshl = Downstairs, syncgroupzewbtz9n = All.
I3_POWER_GROUPS="syncgroupbkmvcshl,syncgroupzewbtz9n"

# ── Health check endpoints ────────────────────────────────────────
declare -A SERVICE_ENDPOINTS=()
declare -A SERVICE_ENDPOINTS_WARN=()
declare -A HEALTH_URLS=()
declare -A HEALTH_URLS_WARN=()
