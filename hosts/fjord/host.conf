# hosts/fjord/host.conf

# ── Identity ───────────────────────────────────────────────────────
HOST_NAME="fjord"

# ── Services ───────────────────────────────────────────────────────
SERVICES=(mushr pawst snoot houstn)

# ── Storage mount (leave empty for no mount) ───────────────────────
STORAGE_DEVICE=""
STORAGE_MOUNT=""
STORAGE_FS=""

# ── Directories (755 config dirs, 775 media dirs) ──────────────────
CONFIG_DIRS=(/opt/pawst/dev/hblake /opt/pawst/dev/hsimah /opt/pawst/test/hblake /opt/pawst/test/hsimah)
MEDIA_DIRS=()

# ── User config ────────────────────────────────────────────────────
LITTLEDOG_EXTRA_GROUPS=""

# ── SSH ────────────────────────────────────────────────────────────
SSH_DISABLE_PASSWORD="true"

# ── Health check endpoints ────────────────────────────────────────
declare -A SERVICE_ENDPOINTS=([pawst]="pawst-dev pawst-test hsimah-dev hsimah-test")
declare -A SERVICE_ENDPOINTS_WARN=()
declare -A HEALTH_URLS=(
  [pawst-dev:lan]="http://pawst.dev.fjord"
  [hsimah-dev:lan]="http://hsimah.dev.fjord"
  [pawst-test:lan]="http://pawst.test.fjord"
  [hsimah-test:lan]="http://hsimah.test.fjord"
)
declare -A HEALTH_URLS_WARN=()
