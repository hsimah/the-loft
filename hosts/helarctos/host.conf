# hosts/helarctos/host.conf
#
# Minisforum MS-S1 MAX (Strix Halo, 128 GB unified memory). CI runner and
# local inference for the agent pipeline; the forge is on space-needle.
#   docs/hosts/helarctos.md

# ── Identity ───────────────────────────────────────────────────────
HOST_NAME="helarctos"

# ── Services ───────────────────────────────────────────────────────
# Sputnik runs only its gpu profile here, kennl only its runner profile
# (each service's .env).
SERVICES=(kennl sputnik snoot houstn)

# ── Storage mount (leave empty for no mount) ───────────────────────
# None yet: one 2 TB disk, /den is a directory on /. A disk in the PCIe 4.0
# x1 M.2 slot will take the model weights (docs/hosts/helarctos.md#storage).
STORAGE_DEVICE=""
STORAGE_MOUNT=""
STORAGE_FS=""

# ── Directories (755 config dirs, 775 media dirs) ──────────────────
CONFIG_DIRS=(
  /opt/kennl/runner
)
MEDIA_DIRS=(
  # GGUF weights served by llama-swap; 60+ GB per large model.
  /den/sputnik/models
)

# ── User config ────────────────────────────────────────────────────
LITTLEDOG_EXTRA_GROUPS="render,video"

# ── GPU memory ─────────────────────────────────────────────────────
# GiB the iGPU may map from system RAM (GTT). The BIOS UMA frame buffer stays
# at its minimum; the bootstrap writes the kernel parameters. Leave headroom
# for the OS, Forgejo and CI. Unverified on this hardware.
GPU_GTT_GIB="108"

# ── SSH ────────────────────────────────────────────────────────────
SSH_DISABLE_PASSWORD="true"

# ── WiFi watchdog ──────────────────────────────────────────────────
# Interim, until the 10GbE has a switch: MT7925 managed by ifupdown.
# Remove with the Wi-Fi stanza once wired (docs/hosts/helarctos.md).
WIFI_IFACE="wlp99s0"
WIFI_DHCP_UNIT="networking"
WIFI_WATCHDOG_MINUTES="2"

# ── Health check endpoints ────────────────────────────────────────
declare -A SERVICE_ENDPOINTS=(
  [sputnik]="llama-swap"
)
declare -A SERVICE_ENDPOINTS_WARN=()
declare -A HEALTH_URLS=(
  [llama-swap:local]="http://localhost:8080/health"
)
declare -A HEALTH_URLS_WARN=()

# ── Publicly reachable hostnames (Cloudflare Tunnel) ──────────────────────────
# None.
PUBLIC_HOSTNAMES=()
