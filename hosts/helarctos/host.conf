# hosts/helarctos/host.conf
#
# Minisforum MS-S1 MAX (Strix Halo, 128 GB unified memory). On-prem forge,
# CI runner and local inference for the agent pipeline. PROPOSED: the
# hardware has not been provisioned; nothing here is verified live.
#   docs/hosts/helarctos.md

# ── Identity ───────────────────────────────────────────────────────
HOST_NAME="helarctos"

# ── Services ───────────────────────────────────────────────────────
# Sputnik runs only its gpu profile here (services/sputnik/.env).
SERVICES=(kennl sputnik snoot houstn)

# ── Storage mount (leave empty for no mount) ───────────────────────
# The PCIe 4.0 x1 M.2 slot: model weights only, where speed matters at load
# time alone. Label it when formatting (setup never formats):
#   sudo mkfs.xfs -L den /dev/<x1 slot partition>
# NVMe names can swap between boots; the label cannot.
STORAGE_DEVICE="/dev/disk/by-label/den"
STORAGE_MOUNT="/den"
STORAGE_FS="xfs"

# ── Directories (755 config dirs, 775 media dirs) ──────────────────
CONFIG_DIRS=(
  /opt/kennl/forgejo/data
  /opt/kennl/forgejo/config
  /opt/kennl/runner
  # Postgres chowns this to its own UID on first start.
  /opt/kennl/db
)
MEDIA_DIRS=(
  # GGUF weights served by llama-swap; 60+ GB per large model.
  /den/sputnik/models
)

# ── User config ────────────────────────────────────────────────────
LITTLEDOG_EXTRA_GROUPS="render,video"

# ── GPU memory ─────────────────────────────────────────────────────
# GiB the iGPU may map from system RAM (GTT). The BIOS UMA frame buffer stays
# at its minimum; the bootstrap writes the kernel parameters. Leave headroom
# for the OS, Forgejo and CI. Unverified on this hardware.
GPU_GTT_GIB="108"

# ── SSH ────────────────────────────────────────────────────────────
SSH_DISABLE_PASSWORD="true"

# ── Health check endpoints ────────────────────────────────────────
# Local tier only until space-needle routes kennl.loft.hsimah.com.
declare -A SERVICE_ENDPOINTS=(
  [kennl]="forgejo"
  [sputnik]="llama-swap"
)
declare -A SERVICE_ENDPOINTS_WARN=()
declare -A HEALTH_URLS=(
  [forgejo:local]="http://localhost:3000/api/healthz"
  [llama-swap:local]="http://localhost:8080/health"
)
declare -A HEALTH_URLS_WARN=()

# ── Publicly reachable hostnames (Cloudflare Tunnel) ──────────────────────────
# None. Kennl is LAN and Tailscale only; GitHub mirrors are the public face.
PUBLIC_HOSTNAMES=()
