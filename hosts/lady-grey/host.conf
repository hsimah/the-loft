# hosts/lady-grey/host.conf
# Surface Pro 3 on Fedora 45 Minimal (the only non-Debian host). niri, greetd and
# Firefox come from Fedora's repos and update with `dnf upgrade`.

# ── Identity ───────────────────────────────────────────────────────
HOST_NAME="lady-grey"

# ── Services ───────────────────────────────────────────────────────
# pupshow (Immich Kiosk) is the idle photo frame; setup skips it until its
# .env is filled in.
SERVICES=(snoot houstn pupshow)

# ── Storage mount (leave empty for no mount) ───────────────────────
STORAGE_DEVICE=""
STORAGE_MOUNT=""
STORAGE_FS=""

# ── Directories (755 config dirs, 775 media dirs) ──────────────────
CONFIG_DIRS=()
MEDIA_DIRS=()

# ── User config ────────────────────────────────────────────────────
LITTLEDOG_EXTRA_GROUPS=""

# ── SSH ────────────────────────────────────────────────────────────
SSH_DISABLE_PASSWORD="true"

# ── WiFi watchdog ──────────────────────────────────────────────────
# Surface Pro 3: Marvell 88W8797 on PCIe (mwifiex_pcie), the same firmware
# family that crashes on Calavera. UNVERIFIED until imaging: record the real
# interface (`ip link`). Fedora manages Wi-Fi with NetworkManager. The
# watchdog no-ops while the interface does not exist.
WIFI_IFACE="loft-unset"
WIFI_DHCP_UNIT="NetworkManager"
WIFI_WATCHDOG_MINUTES="2"
WIFI_FW_RECOVERY="true"
WIFI_FW_MODULE="mwifiex_pcie"

# ── Niri kiosk ─────────────────────────────────────────────────────
# greetd autologs rodnik into niri running a Firefox kiosk on the Capcom
# (Home Assistant) dashboard. After KIOSK_PHOTO_IDLE seconds without input the
# Pupshow photo frame covers it; any touch returns to the dashboard.
NIRI_ENABLED="true"
# Panel is 2160x1440 at 12". Output name from `niri msg outputs`.
NIRI_OUTPUT="eDP-1"
NIRI_SCALE="1.5"
KIOSK_DASHBOARD_URL="https://capcom.loft.hsimah.com/"
KIOSK_PHOTO_URL="http://127.0.0.1:3000"
KIOSK_PHOTO_IDLE="300"
# Seconds without input before the panel powers off; 0 keeps it on.
KIOSK_SCREEN_OFF_IDLE="0"

# ── Health check endpoints ────────────────────────────────────────
declare -A SERVICE_ENDPOINTS=(
  [pupshow]="pupshow"
)
declare -A SERVICE_ENDPOINTS_WARN=()
declare -A HEALTH_URLS=(
  [pupshow:local]="http://127.0.0.1:3000/health"
)
declare -A HEALTH_URLS_WARN=()
