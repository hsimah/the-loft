# Surface Pro 3 i5 / 8 GB; Debian 13. Address/adapter recorded at imaging.
HOST_NAME="ladygrey"
SERVICES=(snoot houstn pupshow)
STORAGE_DEVICE=""
STORAGE_MOUNT=""
STORAGE_FS=""
CONFIG_DIRS=()
MEDIA_DIRS=()
LITTLEDOG_EXTRA_GROUPS=""
SSH_DISABLE_PASSWORD="true"
I3_ENABLED="true"
# Deliberately nonexistent until the installed network interface is observed.
WIFI_IFACE="loft-unset"
WIFI_DHCP_UNIT="networking"
WIFI_FW_RECOVERY="false"
declare -A SERVICE_ENDPOINTS=()
declare -A SERVICE_ENDPOINTS_WARN=()
declare -A HEALTH_URLS=()
declare -A HEALTH_URLS_WARN=()
