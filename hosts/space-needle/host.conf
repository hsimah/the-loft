  [glances:local]="http://localhost:61208/api/4/status"
  # sputnik — open-webui (chat surface)
  [sputnik:lan]="http://sputnik.space-needle"
  [sputnik:ssl]="https://sputnik.loft.hsimah.com"
  # sputnik — n8n (workflow surface)
