# hosts/space-needle/host.conf

# ── Identity ───────────────────────────────────────────────────────
HOST_NAME="space-needle"

# ── Services ───────────────────────────────────────────────────────
SERVICES=(mushr pawpcorn stellarr howlr houstn snoot sputnik hubbl kennl mercurius)

# ── Storage mount (leave empty for no mount) ───────────────────────
STORAGE_DEVICE="/dev/sda1"
STORAGE_MOUNT="/mammoth"
STORAGE_FS="xfs"

# ── Directories (755 config dirs, 775 media dirs) ──────────────────
CONFIG_DIRS=(
  /opt/pawpcorn/config
  /opt/radarr
  /opt/sonarr
  /opt/lidarr
  /opt/bazarr
  /opt/jackett
  /opt/transmission
  /opt/slskd
  /opt/lazylibrarian
  /opt/audiobookshelf/config
  /opt/audiobookshelf/metadata
  /opt/howlr
  /opt/houstn/beszel/data
  /opt/houstn/uptime/data
  /opt/sputnik/open-webui
  /opt/sputnik/n8n
  # Immich's Postgres. Kept off /mammoth deliberately: the library volume
  # is the bulk store, the database wants the root NVMe.
  /opt/hubbl/db
  # Kennl forge (profile forge; the runner is on helarctos). Postgres chowns
  # /opt/kennl/db to its own UID on first start.
  /opt/kennl/forgejo/data
  /opt/kennl/forgejo/config
  /opt/kennl/db
)
MEDIA_DIRS=(
  /mammoth/library/movies
  /mammoth/library/tv
  /mammoth/library/music
  /mammoth/library/audiobooks
  /mammoth/library/videos
  /mammoth/library/stand-up
  /mammoth/downloads/transmission
  /mammoth/downloads/transmission/audiobooks
  /mammoth/downloads/soulseek
  /mammoth/downloads/soulseek/complete
  /mammoth/downloads/soulseek/downloading
  /mammoth/pawpcorn/transcode
  # Hubbl's Immich-owned library (content-hashed; never reorganise by hand)
  /mammoth/hubbl/library
  # OneDrive drain target. Temporary: delete after the import is verified.
  /mammoth/hubbl/staging
  # Mercurius (SilverBullet) data folder: server config, accounts, deploy keys
  # and the spaces. SilverBullet runs as this folder's owner.
  /mammoth/mercurius
)

# ── User config ────────────────────────────────────────────────────
LITTLEDOG_EXTRA_GROUPS="render,video"

# ── SSH ────────────────────────────────────────────────────────────
SSH_DISABLE_PASSWORD="false"

# ── Health check endpoints ────────────────────────────────────────
# SERVICE_ENDPOINTS: service → space-separated endpoint labels
# SERVICE_ENDPOINTS_WARN: service → space-separated warn-only labels
# HEALTH_URLS: label:tier → URL  (tiers: local, lan, ssl)
# HEALTH_URLS_WARN: label:tier → URL (warn-only, e.g. VPN-dependent)

declare -A SERVICE_ENDPOINTS=(
  [pawpcorn]="pawpcorn"
  [stellarr]="radarr sonarr lidarr bazarr jackett audiobookshelf lazylibrarian"
  [howlr]="howlr snapweb"
  [houstn]="beszel uptime homepage glances"
  [sputnik]="sputnik n8n"
  [hubbl]="hubbl"
  [kennl]="forgejo"
  [mercurius]="mercurius"
)
declare -A SERVICE_ENDPOINTS_WARN=(
  [stellarr]="transmission slskd"
)

