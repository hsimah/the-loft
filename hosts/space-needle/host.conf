declare -A HEALTH_URLS_WARN=(
  # stellarr — transmission (VPN-dependent)
  [transmission:local]="http://localhost:9091"
  [transmission:lan]="http://transmission.space-needle"
  [transmission:ssl]="https://transmission.loft.hsimah.com"
  # stellarr — slskd (VPN-dependent)
  [slskd:local]="http://localhost:5030"
  [slskd:lan]="http://soulseek.space-needle"
  [slskd:ssl]="https://soulseek.loft.hsimah.com"
)

# ── OneDrive migration puller (TEMPORARY) ─────────────────────────────────────
# Drains a OneDrive folder into Hubbl's staging directory with rclone, on a
# cron installed by setup.sh. This is migration scaffolding with an explicit
# end: once a few consecutive runs report "0 new files" and the library has
# been imported, set ONEDRIVE_PULL_ENABLED="false", re-run setup.sh to remove
# the cron, and delete the staging directory.
#
# The rclone remote and its OAuth refresh token live in
# /etc/loft/rclone/rclone.conf (root, mode 600) — never in this repo.
#   docs/operations/onedrive-migration.md
ONEDRIVE_PULL_ENABLED="false"
ONEDRIVE_PULL_REMOTE="onedrive:Pictures"
ONEDRIVE_PULL_DEST="/mammoth/hubbl/staging"
ONEDRIVE_PULL_MINUTES="10"
# Empty = unthrottled. Set e.g. "20M" if the pull saturates the uplink.
ONEDRIVE_PULL_BWLIMIT=""
# Graph API rate limits are per-account; lower these if OneDrive throttles.
ONEDRIVE_PULL_TRANSFERS="4"
ONEDRIVE_PULL_TPSLIMIT="10"

# ── Publicly reachable hostnames (Cloudflare Tunnel) ──────────────────────────
# Declared INTENT, not proof — the tunnel's real hostname list lives in the
# Cloudflare dashboard. Declaring a name here is what lets tests/test-caddy.sh
# check it: first-level only, routed in the Caddyfile, and resolved locally by
# dnsmasq. See docs/services/mushr.md#public-hostnames-must-be-first-level.
#
# Must be at most one label below the registrable domain. Cloudflare's free
# Universal SSL covers example.com and *.example.com only, so a loft name like
# anything.loft.hsimah.com cannot be served through the tunnel.
PUBLIC_HOSTNAMES=(
  hubbl.hsimah.com
)
