# space-needle: Caddy also joins mercurius-proxy, the internal network that is
# Mercurius's only path to the LAN. setup.sh creates it with --internal, so
# nothing on it has a route out (docs/services/mercurius.md).
services:
  mushr:
    networks:
      - loft-proxy
      - mercurius-proxy

networks:
  mercurius-proxy:
    external: true
