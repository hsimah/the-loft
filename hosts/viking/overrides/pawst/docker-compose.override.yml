services: !override
  pawst:
    image: nginx:1.30.4-alpine
    container_name: pawst
    user: "1003:1003"
    entrypoint: [nginx, -g, "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.50
    pids_limit: 50
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
    tmpfs: ["/tmp:uid=1003,gid=1003,mode=1770"]
    volumes:
      - ./nginx-unprivileged.conf:/etc/nginx/nginx.conf:ro
      - /opt/pawst/prod/hblake:/srv/hblake:ro
      - /opt/pawst/prod/hsimah:/srv/hsimah:ro
    networks: [pawst-prod]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null --header='Host: hbla.ke' http://127.0.0.1:8080/index.html && wget -q -O /dev/null --header='Host: hsimah.com' http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
networks: !override
  pawst-prod:
    name: loft-pawst-prod
    external: true
