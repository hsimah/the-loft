# Original Surface Pro; replaces Viking's Upstairs audio role after validation.
HOST_NAME="woodstock"
SERVICES=(howlr snoot houstn)

STORAGE_DEVICE=""
STORAGE_MOUNT=""
STORAGE_FS=""
CONFIG_DIRS=()
MEDIA_DIRS=()
LITTLEDOG_EXTRA_GROUPS="audio"
SSH_DISABLE_PASSWORD="true"

# Operator-observed interface/driver and active networking service.
# Retain Debian installer networking; do not migrate a live SSH connection.
WIFI_IFACE="wlx28187844d6a5"
WIFI_DHCP_UNIT="networking"
WIFI_WATCHDOG_MINUTES="2"
# Same driver as Calavera; recovery behavior still needs validation here.
WIFI_FW_RECOVERY="true"
WIFI_FW_MODULE="mwifiex_usb"

I3_ENABLED="true"
I3_DASHBOARD_URL="https://howlr.loft.hsimah.com/#/home?player=woodstock&showFullscreenPlayer=true"
I3_DPI="125"
# Known All stream. TODO: add the observed Upstairs stream ID before cutover.
# This controls screen wake only; MA group membership is configured in MA.
I3_POWER_GROUPS="syncgroupzewbtz9n"

declare -A SERVICE_ENDPOINTS=()
declare -A SERVICE_ENDPOINTS_WARN=()
declare -A HEALTH_URLS=()
declare -A HEALTH_URLS_WARN=()
