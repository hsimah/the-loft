worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path /tmp/fastcgi;
    proxy_temp_path /tmp/proxy;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Do not log query strings, credentials, cookies or request bodies.
    log_format clog '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout clog;
    # Only Caddy on this dedicated network may supply the edge client identity.
    set_real_ip_from 172.30.93.2;
    real_ip_header X-Clog-Client-IP;
    limit_req_zone $binary_remote_addr zone=clog_login:1m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=clog_api:1m rate=10r/s;
    server { listen 8080 default_server; server_name _; return 404; }
    server {
        listen 8080;
        server_name clog.hsimah.com;
        client_max_body_size 64k;
        client_body_timeout 15s;
        client_header_timeout 15s;
        keepalive_timeout 15s;
        limit_req_status 429;
        # Regex denies precede disk serving, including inside /assets/.
        location ~* (?:^|/)[.]|[.](?:php[0-9]*|phtml|phar|sqlite|sql|bak)(?:/|$) { return 404; }
        location /assets/ {
            alias /srv/assets/;
            autoindex off;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }
        location = /auth/login {
            limit_req zone=clog_login burst=5 nodelay;
            include /etc/nginx/clog-fastcgi.conf;
        }
        location = /graphql {
            limit_req zone=clog_api burst=20 nodelay;
            include /etc/nginx/clog-fastcgi.conf;
        }
        location / { include /etc/nginx/clog-fastcgi.conf; }
    }
}
