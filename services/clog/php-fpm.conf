[global]
error_log = /proc/self/fd/2
pid = /tmp/php-fpm.pid
daemonize = no

[clog]
; Master and workers already run as numeric UID/GID 1003.
listen = /run/clog/php.sock
listen.mode = 0660
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 30s
catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
env[CLOG_DB] = $CLOG_DB
env[CLOG_SESSION_PATH] = $CLOG_SESSION_PATH
env[CLOG_ORIGIN] = $CLOG_ORIGIN
php_admin_value[memory_limit] = 64M
php_admin_value[session.save_path] = /var/lib/clog/sessions
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
security.limit_extensions = .php
