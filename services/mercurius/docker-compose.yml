# Mercurius — household wiki (SilverBullet) and documents (Paperless-ngx).
#
# Paperless is adapted from upstream's v3.3.4 docker-compose.postgres-tika.yml
# to fleet conventions. Everything lives on the LUKS volume mounted at
# /mercurius, and no bind creates its source: while the vault is locked Docker
# refuses to start the group rather than initialise an empty archive or wiki on
# the unencrypted disk. Unlock with control-plane/mercurius-vault.sh.
#
# No route out except one. The internal default network joins everything; the
# internal mercurius-proxy network (created by setup.sh) is shared with Caddy
# only. Paperless and the optional paperless-gpt (profile ocr) also join
# mercurius-llm, a bridge the firewall limits to llama-swap on helarctos:8080.
#   docs/services/mercurius.md
services:
  silverbullet:
    # -slim has no Chromium, so the Runtime API (/.runtime) is unavailable.
    image: ghcr.io/silverbulletmd/silverbullet:2.12.1-slim
    container_name: silverbullet
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      # Never set legacy SB_* variables (SB_NAME, SB_USER, SB_URL_PREFIX…):
      # any of them boots SilverBullet in single-space mode, with no accounts.
      # Server-wide kill switch for /.shell, whatever a space's settings say.
      - SB_SHELL_BACKEND=off
    # The entrypoint starts as root, adds a passwd entry for the owner of /data
    # and drops to that user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    volumes:
      # Server config, accounts and spaces; each space's revisions are a local
      # git repository inside it, with no remote.
      - type: bind
        source: /mercurius/silverbullet
        target: /data
        bind:
          create_host_path: false
    # No route out: net.proxyFetch reaches only this group's internal network
    # (Paperless at http://paperless:8000).
    networks:
      - default
      - mercurius-proxy

  paperless:
    # Schema migrations are one-way: export and dump before changing this tag.
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.4
    container_name: paperless
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PAPERLESS_URL: https://paperless.${LOFT_DOMAIN?}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY?}
      PAPERLESS_TIME_ZONE: ${TZ:-America/Los_Angeles}
      PAPERLESS_OCR_LANGUAGE: eng
      # consume/a/b/x.pdf is consumed with the tags a and b.
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
      # No route to IMAP; vault mail arrives through the fetcher in docs/automation/intake.md.
      PAPERLESS_EMAIL_TASK_CRON: disable
      # littledog:pack-member, which owns the app directories on the vault.
      USERMAP_UID: 1003
      USERMAP_GID: 1003
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${DB_PASSWORD?}
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      # Built-in AI on the local models: suggestions and chat, and embeddings for
      # similar documents. The route is mercurius-llm; the key comes from .env.
      # The index job runs daily (PAPERLESS_LLM_INDEX_TASK_CRON, default 02:10).
      PAPERLESS_AI_ENABLED: "true"
      PAPERLESS_AI_LLM_BACKEND: openai-like
      PAPERLESS_AI_LLM_ENDPOINT: http://helarctos:8080/v1
      PAPERLESS_AI_LLM_API_KEY: ${LLAMA_SWAP_API_KEY:-}
      PAPERLESS_AI_LLM_MODEL: qwen3.6-35b-a3b
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: openai-like
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: embeddinggemma
      # A request can wait for the 35B model to load (23–36 s) after a swap.
      PAPERLESS_AI_LLM_REQUEST_TIMEOUT: 300
    volumes:
      - type: bind
        source: /mercurius/data
        target: /usr/src/paperless/data
        bind:
          create_host_path: false
      - type: bind
        source: /mercurius/media
        target: /usr/src/paperless/media
        bind:
          create_host_path: false
      - type: bind
        source: /mercurius/export
        target: /usr/src/paperless/export
        bind:
          create_host_path: false
      - type: bind
        source: /mercurius/consume
        target: /usr/src/paperless/consume
        bind:
          create_host_path: false
    networks:
      - default
      - mercurius-proxy
      - mercurius-llm
    # The firewall blocks DNS, so the address is pinned (see paperless-gpt).
    extra_hosts:
      - "helarctos:192.168.86.21"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      gotenberg:
        condition: service_started
      tika:
        condition: service_started

  # Second-pass OCR with the vision models on helarctos, after Paperless's own
  # Tesseract pass (docs/services/mercurius.md#second-pass-ocr). It has no
  # login: it is on the internal network and a loopback port, never on
  # loft-proxy or mercurius-proxy. mercurius-llm is its only way out;
  # hosts/space-needle/mercurius-egress.nft allows helarctos:8080 on that
  # bridge and nothing else. The address is pinned because the firewall blocks DNS.
  paperless-gpt:
    profiles: [ocr]
    image: icereed/paperless-gpt:v0.31.0
    container_name: paperless-gpt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # littledog:pack-member, which owns these directories on the vault.
      PUID: 1003
      PGID: 1003
      PAPERLESS_BASE_URL: http://paperless:8000
      PAPERLESS_API_TOKEN: ${GPT_PAPERLESS_TOKEN:-}
      OPENAI_BASE_URL: http://helarctos:8080/v1
      OPENAI_API_KEY: ${LLAMA_SWAP_API_KEY:-}
      # OCR: the vision model, decoded deterministically, every page.
      OCR_PROVIDER: llm
      VISION_LLM_PROVIDER: openai
      VISION_LLM_MODEL: glm-ocr
      VISION_LLM_TEMPERATURE: 0
      OCR_PROCESS_MODE: image
      OCR_LIMIT_PAGES: 0
      AUTO_OCR_TAG: paperless-gpt-ocr-auto
      # Required by paperless-gpt but unused: suggestions come from Paperless's
      # own AI, and nothing carries paperless-gpt's suggestion tags.
      LLM_PROVIDER: openai
      LLM_MODEL: qwen3.6-35b-a3b
      LOG_LEVEL: info
    extra_hosts:
      - "helarctos:192.168.86.21"
    volumes:
      - type: bind
        source: /mercurius/gpt/config
        target: /app/config
        bind:
          create_host_path: false
      - type: bind
        source: /mercurius/gpt/db
        target: /app/db
        bind:
          create_host_path: false
      - type: bind
        source: /mercurius/gpt/prompts
        target: /app/prompts
        bind:
          create_host_path: false
    # The web page (review, prompts) is reached through an SSH tunnel.
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - default
      - mercurius-llm
    depends_on:
      - paperless

  db:
    image: postgres:18.6
    container_name: mercurius-db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      # Read only when initialising an empty /mercurius/db.
      POSTGRES_PASSWORD: ${DB_PASSWORD?}
    volumes:
      # Postgres 18 keeps its cluster in a versioned subdirectory of this path.
      - type: bind
        source: /mercurius/db
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:9.1.2-alpine
    container_name: mercurius-redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - type: bind
        source: /mercurius/redis
        target: /data
        bind:
          create_host_path: false

  gotenberg:
    image: gotenberg/gotenberg:8.37.0
    container_name: mercurius-gotenberg
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Upstream's flags: Chromium renders .eml files, and must not run their
    # JavaScript or fetch remote content such as tracking pixels.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=^file:///tmp/.*"

  tika:
    image: apache/tika:3.3.1.0
    container_name: mercurius-tika
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    internal: true
  mercurius-proxy:
    external: true
  # Created by setup.sh with a fixed bridge name for the firewall to match.
  mercurius-llm:
    external: true
