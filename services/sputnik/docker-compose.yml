services:
  # Engine: unauthenticated; publish only on host loopback.
  ollama:
    image: ollama/ollama:0.32.5
    container_name: ollama
    restart: unless-stopped
    profiles:
      - engine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /mammoth/sputnik/models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      # Keep weights resident to avoid repeated cold loads; costs RAM.
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-16384}
    networks:
      - loft-proxy

  # Chat UI; application login is separate from Ollama access.
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.11.0
    container_name: open-webui
    restart: unless-stopped
    profiles:
      - chat
    # Optional across profiles; retain start ordering when engine is enabled.
    depends_on:
      ollama:
        condition: service_started
        required: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=true
      - WEBUI_URL=https://sputnik.${LOFT_DOMAIN}
    volumes:
      - /opt/sputnik/open-webui:/app/backend/data
    dns:
      - 192.168.86.28
    networks:
      - loft-proxy

  # Workflow runner; back up its data AND N8N_ENCRYPTION_KEY.
  n8n:
    image: n8nio/n8n:2.32.7
    container_name: n8n
    restart: unless-stopped
    profiles:
      - agent
    # Optional across profiles; retain start ordering when engine is enabled.
    depends_on:
      ollama:
        condition: service_started
        required: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    # Host-owned data uses UID 1003; image defaults to a different user.
    user: "1003:1003"
    environment:
      # Mount the whole writable home, including sibling cache directories.
      # Explicit HOME avoids relying on a passwd entry for this UID.
      - N8N_USER_FOLDER=/home/node
      - HOME=/home/node
      - N8N_HOST=n8n.${LOFT_DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      # HTTPS origins must agree with the Google OAuth callback.
      - N8N_EDITOR_BASE_URL=https://n8n.${LOFT_DOMAIN}
      - N8N_WEBHOOK_URL=https://n8n.${LOFT_DOMAIN}
      - GENERIC_TIMEZONE=${TZ:-America/Los_Angeles}
      - TZ=${TZ:-America/Los_Angeles}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_SURVEY_ENABLED=false
      # Explicit runner/package/compression settings; review on upgrades.
      - N8N_UNVERIFIED_PACKAGES_ENABLED=false
      - N8N_RUNNERS_TASK_TIMEOUT=300
      - N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES=268435456
      - N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES=1000
      # File nodes may publish here; keep credential-file protection enabled.
      - N8N_RESTRICT_FILE_ACCESS_TO=/briefing
    volumes:
      - /opt/sputnik/n8n:/home/node
      - /opt/sputnik/briefing:/briefing
    dns:
      - 192.168.86.28
    networks:
      - loft-proxy

networks:
  loft-proxy:
    external: true
