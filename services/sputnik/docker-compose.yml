services:
  # GPU engine on helarctos: llama-swap starting llama-server (Vulkan) per
  # requested model. Serves OpenAI and Anthropic Messages APIs on :8080 to the
  # LAN, gated by LLAMA_SWAP_API_KEY. Models: llama-swap.yaml.
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:v265-vulkan-b11804
    container_name: llama-swap
    restart: unless-stopped
    profiles:
      - gpu
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Root inside the image, so it can open /dev/dri without the host's
    # render GID; no capabilities are needed for that.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/dri:/dev/dri
    environment:
      - LLAMA_SWAP_API_KEY=${LLAMA_SWAP_API_KEY}
    volumes:
      - ./llama-swap.yaml:/app/config.yaml:ro
      - /den/sputnik/models:/models:ro
    ports:
      - "8080:8080"

  # Chat UI; application login is separate from the llama-swap key.
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.12.4
    container_name: open-webui
    restart: unless-stopped
    profiles:
      - chat
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      # Models come from llama-swap on helarctos (gpu profile); key is the same LLAMA_SWAP_API_KEY.
      - ENABLE_OLLAMA_API=false
      - OPENAI_API_BASE_URL=http://helarctos:8080/v1
      - OPENAI_API_KEY=${LLAMA_SWAP_API_KEY:-}
      - WEBUI_AUTH=true
      - WEBUI_URL=https://sputnik.${LOFT_DOMAIN}
    volumes:
      - /opt/sputnik/open-webui:/app/backend/data
    dns:
      - 192.168.86.28
    networks:
      - loft-proxy

  # Workflow runner; back up its data AND N8N_ENCRYPTION_KEY.
  n8n:
    image: n8nio/n8n:2.44.7
    container_name: n8n
    restart: unless-stopped
    profiles:
      - agent
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    # Host-owned data uses UID 1003; image defaults to a different user.
    user: "1003:1003"
    environment:
      # Mount the whole writable home, including sibling cache directories.
      # Explicit HOME avoids relying on a passwd entry for this UID.
      - N8N_USER_FOLDER=/home/node
      - HOME=/home/node
      - N8N_HOST=n8n.${LOFT_DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      # HTTPS origins must agree with the Google OAuth callback.
      - N8N_EDITOR_BASE_URL=https://n8n.${LOFT_DOMAIN}
      - N8N_WEBHOOK_URL=https://n8n.${LOFT_DOMAIN}
      - GENERIC_TIMEZONE=${TZ:-America/Los_Angeles}
      - TZ=${TZ:-America/Los_Angeles}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_SURVEY_ENABLED=false
      # Explicit runner/package/compression settings; review on upgrades.
      - N8N_UNVERIFIED_PACKAGES_ENABLED=false
      - N8N_RUNNERS_TASK_TIMEOUT=300
      - N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES=268435456
      - N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES=1000
    volumes:
      - /opt/sputnik/n8n:/home/node
    dns:
      - 192.168.86.28
    networks:
      - loft-proxy

networks:
  loft-proxy:
    external: true
