services:
  vpn:
    # Gluetun on NordVPN WireGuard (NordLynx). The key is the account's
    # NordLynx private key, fetched once from the NordVPN API with the access
    # token (docs/services/stellarr.md#vpn); the token itself is not used here.
    image: qmcgaw/gluetun:v3.41.3
    container_name: stellarr-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${NORDVPN_WIREGUARD_KEY}
      - SERVER_COUNTRIES=Netherlands
      # Replies to LAN clients reaching the published UI ports.
      - FIREWALL_OUTBOUND_SUBNETS=192.168.86.0/24
      # Refresh the built-in server list so a stale pin can't strand it.
      - UPDATER_PERIOD=24h
      - TZ=${TZ}
    ports:
      # Transmission
      - 9091:9091
      # - 8080:8080  # unknown — uncomment if needed
      - 51413:51413
      - 51413:51413/udp
      # Soulseek (slskd)
      - 5030:5030
      - 50300:50300
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: unless-stopped

  transmission:
    image: lscr.io/linuxserver/transmission:4.1.4-r0-ls368
    container_name: transmission
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /opt/transmission:/config
      - /mammoth/downloads:/downloads
    restart: unless-stopped
    network_mode: service:vpn
    depends_on:
      - vpn

  slskd:
    image: slskd/slskd:0.26.2
    container_name: slskd
    user: "${PUID}:${PGID}"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_SOULSEEK_USERNAME=${SLSKD_SOULSEEK_USERNAME}
      - SLSKD_SOULSEEK_PASSWORD=${SLSKD_SOULSEEK_PASSWORD}
      - SLSKD_DOWNLOADS_DIR=/downloads/complete/lidarr
      - SLSKD_INCOMPLETE_DIR=/downloads/incomplete
      - SLSKD_SHARED_DIR=/music
    volumes:
      - /opt/slskd:/app
      - /mammoth/downloads:/downloads
      - /mammoth/library/music:/music:ro
    restart: unless-stopped
    network_mode: service:vpn
    depends_on:
      - vpn

  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:afe0394f-ls358
    container_name: lazylibrarian
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /opt/lazylibrarian:/config
      # Match Transmission's paths; preserve originals when importing for seeding.
      - /mammoth/downloads:/downloads
      - /mammoth/library/audiobooks:/audiobooks
    healthcheck:
      # Basic-auth challenges also prove the web server is ready.
      test: ["CMD-SHELL", "code=$$(curl --silent --location --max-time 5 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5299/) && { [ \"$$code\" = 200 ] || [ \"$$code\" = 401 ]; }"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - loft-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.2
    container_name: audiobookshelf
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - PORT=8080
    volumes:
      - /opt/audiobookshelf/config:/config
      - /opt/audiobookshelf/metadata:/metadata
      - /mammoth/library/audiobooks:/audiobooks:ro
    networks:
      - loft-proxy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/ping').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls325
    container_name: radarr
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /opt/radarr:/config
      - /mammoth/library/movies:/movies
      - /mammoth/downloads:/downloads
    restart: unless-stopped
    networks:
      - loft-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329
    container_name: sonarr
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /opt/sonarr:/config
      - /mammoth/library/tv:/tv
      - /mammoth/downloads:/downloads
    restart: unless-stopped
    networks:
      - loft-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  lidarr:
    # Pinned to a *nightly* build on purpose, not the stable line. The
    # database schema is ahead of stable, and Lidarr refuses to open a
    # database written by a newer build — so moving to stable is a
    # downgrade that would fail to start. Back up /opt/lidarr before any
    # bump: rolling back means restoring it. Getting onto the stable line
    # means exporting the library and rebuilding the database: a separate
    # project.
    image: lscr.io/linuxserver/lidarr:nightly-3.2.1.5182-ls223
    container_name: lidarr
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /opt/lidarr:/config
      - /mammoth/library/music:/music
      - /mammoth/downloads:/downloads
    restart: unless-stopped
    networks:
      - loft-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls371
    container_name: bazarr
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /opt/bazarr:/config
      - /mammoth/library/movies:/movies
      - /mammoth/library/tv:/tv
    restart: unless-stopped
    networks:
      - loft-proxy

  jackett:
    image: lscr.io/linuxserver/jackett:v0.24.3014-ls27
    container_name: jackett
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - AUTO_UPDATE=true
    volumes:
      - /opt/jackett:/config
    restart: unless-stopped
    networks:
      - loft-proxy

networks:
  loft-proxy:
    external: true
